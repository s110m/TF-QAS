model:
  name: super_qfc0
  transpile_before_run: false
  load_op_list: false
  arch:
    n_wires: 4
    down_sample_kernel_size: 6
    encoder_op_list_name: 4x4_ryzxy
    n_layers_per_block: 2
    q_layer_name: u3cu3_s0
    n_blocks: 3
    n_front_share_blocks: 1
    n_front_share_wires: 1
    n_front_share_ops: 1
  sampler:
    strategy:
      name: plain

dataset:
  name: mnist
  root: ./mnist_data
  train_valid_split_ratio: [0.9, 0.1]
  center_crop: 28
  resize: 28
  resize_mode: bilinear
  binarize: false
  binarize_threshold: 0.1307
  digits_of_interest: [0, 1, 2, 3]
  n_test_samples: null
  n_valid_samples: null
  input_name: image
  target_name: digit
  fashion: false

criterion:
  name: nll

optimizer:
  name: adam
  lr: 5.0e-3
  weight_decay: 1.0e-4
  lambda_lr: 1.0e-2

scheduler:
  name: cosine_warm

run:
  n_epochs: 200
  n_warm_epochs: 30
  bsz: 256
  workers_per_gpu: 8
  device: gpu

trainer:
  name: super_q_trainer
  add_noise: false
  act_quant: false
  act_quant_skip_last_node: true
  act_quant_loss: true
  act_quant_loss_lambda: 10

callbacks:
  - callback: SubnetInferenceRunner
    split: valid
    subnet: smallest
    subcallbacks:
      - metrics: CategoricalAccuracy
        name: acc/smallest_valid
      - metrics: NLLError
        name: loss/smallest_valid
  - callback: SubnetInferenceRunner
    split: valid
    subnet: middle
    subcallbacks:
      - metrics: CategoricalAccuracy
        name: acc/middle_valid
      - metrics: NLLError
        name: loss/middle_valid
  - callback: SubnetInferenceRunner
    split: valid
    subnet: largest
    subcallbacks:
      - metrics: CategoricalAccuracy
        name: acc/valid
      - metrics: NLLError
        name: loss/valid
  - callback: MaxSaver
    name: acc/valid
  - callback: Saver
    max_to_keep: 10

debug:
  pdb: false
  set_seed: true
  seed: 42

regularization:
  unitary_loss: false
  unitary_loss_lambda_trainable: false
  unitary_loss_lambda: 0

legalization:
  legalize: false
  epoch_interval: 9999999999
  step_interval: 9999999999

qiskit:
  use_qiskit: false
  use_real_qc: false
  backend_name: null
  noise_model_name: null
  basis_gates_name: null
  n_shots: 8192
  initial_layout: null
  seed_transpiler: 42
  seed_simulator: 42
  optimization_level: 0
  est_success_rate: false
  max_jobs: 1

ckpt:
  load_ckpt: false
  load_trainer: false
  weight_from_scratch: false
  name: checkpoints/max-acc-valid.pt

verbose: false
get_n_params: false

prune:
  eval:
    remove_ops: false
    remove_ops_thres: null
