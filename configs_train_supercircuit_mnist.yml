
model:
  transpile_before_run: False
  load_op_list: False
  name: super_qfc0
  arch:
    n_wires: 4
    down_sample_kernel_size: 6
    encoder_op_list_name: 4x4_ryzxy
    n_layers_per_block: 2
    q_layer_name: u3cu3_s0
    n_blocks: 3
    n_front_share_blocks: 1
    n_front_share_wires: 1
    n_front_share_ops: 1
  sampler:
    strategy:
      name: plain


scheduler:
  name: cosine_warm

run:
  n_epochs: 200
  n_warm_epochs: 30
  bsz: 256
  workers_per_gpu: 8
  device: gpu

