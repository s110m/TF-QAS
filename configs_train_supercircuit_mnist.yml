callbacks:
  - callback: 'SubnetInferenceRunner'
    split: 'valid'
    subnet: 'smallest'
    subcallbacks:
      - metrics: 'CategoricalAccuracy'
        name: 'acc/smallest_valid'
      - metrics: 'NLLError'
        name: 'loss/smallest_valid'
  - callback: 'SubnetInferenceRunner'
    split: 'valid'
    subnet: 'middle'
    subcallbacks:
      - metrics: 'CategoricalAccuracy'
        name: 'acc/middle_valid'
      - metrics: 'NLLError'
        name: 'loss/middle_valid'
  - callback: 'SubnetInferenceRunner'
    split: 'valid'
    subnet: 'largest'
    subcallbacks:
      - metrics: 'CategoricalAccuracy'
        name: 'acc/largest_valid'
      - metrics: 'NLLError'
        name: 'loss/largest_valid'
  - callback: 'SubnetInferenceRunner'
    split: 'test'
    subnet: 'smallest'
    subcallbacks:
      - metrics: 'CategoricalAccuracy'
        name: 'acc/smallest_test'
      - metrics: 'NLLError'
        name: 'loss/smallest_test'
  - callback: 'SubnetInferenceRunner'
    split: 'test'
    subnet: 'middle'
    subcallbacks:
      - metrics: 'CategoricalAccuracy'
        name: 'acc/middle_test'
      - metrics: 'NLLError'
        name: 'loss/middle_test'
  - callback: 'SubnetInferenceRunner'
    split: 'test'
    subnet: 'largest'
    subcallbacks:
      - metrics: 'CategoricalAccuracy'
        name: 'acc/largest_test'
      - metrics: 'NLLError'
        name: 'loss/largest_test'
  - callback: 'MaxSaver'
    name: 'acc/largest_valid'
  - callback: 'Saver'
    max_to_keep: 10




dataset:
  name: mnist
  root: 'examples/data/fashion_mnist'
  train_valid_split_ratio: [0.95, 0.05]
  center_crop: 24
  resize: 28
  resize_mode: bilinear
  binarize: False
  binarize_threshold: 0.1307
  digits_of_interest: [0, 1, 2, 3]
  n_test_samples: null
  n_valid_samples: null
  input_name: image
  target_name: digit
  fashion: True

criterion:
  name: nll

optimizer:
  name: adam
  lr: 5e-3
  weight_decay: 1.0e-4
  lambda_lr: 1.e-2


trainer:
  name: super_q_trainer
  add_noise: False
  act_quant: False
  act_quant_skip_last_node: True
  act_quant_loss: True
  act_quant_loss_lambda: 10


debug:
  pdb: False
  set_seed: True
  seed: 42

regularization:
  unitary_loss: False
  unitary_loss_lambda_trainable: False
  unitary_loss_lambda: 0

legalization:
  legalize: False
  epoch_interval: 9999999999
  step_interval: 9999999999

